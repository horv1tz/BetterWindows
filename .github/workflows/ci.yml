name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-core:
    name: Protocol + Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Protocol is up to date
        run: node tools/gen-protocol.mjs --check
      - name: Core tests
        run: dotnet test tests/BetterWindows.Core.Tests -c Release --logger "trx;LogFileName=core.trx"
      - name: Compile-check Windows projects
        run: dotnet build BetterWindows.sln -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-results, path: '**/*.trx' }

  ui:
    name: UI (check, test, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  windows:
    name: Windows build + tests + smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI bundle into Host/wwwroot
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build solution
        run: dotnet build BetterWindows.sln -c Release
      - name: Core tests
        run: dotnet test tests/BetterWindows.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-win.trx"
      - name: Windows integration tests
        run: dotnet test tests/BetterWindows.Windows.Tests -c Release --no-build --logger "trx;LogFileName=windows.trx"
      - name: Publish self-contained win-x64 build
        if: always()
        run: dotnet publish src/BetterWindows.Host -c Release -r win-x64 --self-contained true -o publish/BetterWindows
      - name: Diagnose (platform self-check on a real Windows)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/BetterWindows/BetterWindows.exe).Path
          # WinExe: wait for it and capture the output through files
          $p = Start-Process -FilePath $exe -ArgumentList '--diagnose','--out',"$PWD\diagnose.txt" -Wait -PassThru -NoNewWindow
          "exit code: $($p.ExitCode)"
          if (Test-Path diagnose.txt) { Get-Content diagnose.txt } else { "no diagnose.txt written" }
      - name: Smoke test (real desktop session)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/BetterWindows/BetterWindows.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','--out',"$PWD\smoke.txt" -Wait -PassThru -NoNewWindow
          "exit code: $($p.ExitCode)"
          if (Test-Path smoke.txt) { Get-Content smoke.txt } else { "no smoke.txt written" }
          $logs = Join-Path $env:LOCALAPPDATA 'BetterWindows\logs'
          if (Test-Path $logs) { Copy-Item $logs -Destination smoke-logs -Recurse }
      - name: Visual smoke (screenshot of the running shell)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/BetterWindows/BetterWindows.exe).Path
          $env:BETTERWINDOWS_SMOKE_HOLD_SECONDS = '14'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','--out',"$PWD\smoke-visual.txt" -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\screenshot-shell.png")
          "screen: $($b.Width)x$($b.Height)"
          $p.WaitForExit(30000) | Out-Null
          "exit code: $($p.ExitCode)"
          if (Test-Path smoke-visual.txt) { Get-Content smoke-visual.txt }
      - name: Package
        if: always()
        shell: pwsh
        run: Compress-Archive -Path publish/BetterWindows/* -DestinationPath BetterWindows-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWindows-win-x64
          path: BetterWindows-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: |
            **/*.trx
            diagnose.txt
            smoke.txt
            smoke-visual.txt
            smoke-logs/**
            screenshot*.png
